<main>

<h2>Entre para a tripulação!</h2>

<form action="#" method="post">

<fieldset>

<legend>Cadastro de Pirata</legend>

<p>

<label for="nome">Nome:</label>

<input
type="text"
id="nome"
name="nome"
required>

</p>

<p>

<label for="email">E-mail:</label>

<input
type="email"
id="email"
name="email"
required>

</p>

<p>

<label for="idade">Idade:</label>

<input
type="number"
id="idade"
name="idade"
min="1"
max="120">

</p>

<p>

<label for="personagem">Personagem favorito:</label>

<select id="personagem" name="personagem">

<option>Luffy</option>
<option>Zoro</option>
<option>Nami</option>
<option>Sanji</option>
<option>Usopp</option>
<option>Robin</option>
<option>Chopper</option>
<option>Franky</option>
<option>Brook</option>
<option>Jinbe</option>

</select>

</p>

<p>

<label for="mensagem">Mensagem:</label>

<br>

<textarea
id="mensagem"
name="mensagem"
rows="8"
cols="40"
placeholder="Escreva sua mensagem..."></textarea>

</p>

<p>

<input type="checkbox" id="aceite" required>

<label for="aceite">
Quero fazer parte da tripulação.
</label>

</p>

<button type="submit">Enviar mensagem</button>

<button type="reset">Limpar</button>

</fieldset>

</form>

</main>
